[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "torchboost-unified-research"
version = "0.7.0.dev0"
description = "Native progressive differentiable forests with explicit adaptive controls"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2", "joblib>=1.3"]
[project.optional-dependencies]
experiment = ["pytest>=8", "xgboost>=2", "lightgbm>=4", "catboost>=1.2", "matplotlib>=3.7"]
[tool.setuptools.packages.find]
include = ["torchboost*"]
