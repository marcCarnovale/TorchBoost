name: HIGGS strong-tree corner deformation

on:
  push:
    branches: [research/universal-soft-tree-2026-10-01]
    paths:
      - 'experiments/higgs_strong_tree_corner_deformation.py'
      - '.github/workflows/higgs-strong-tree-corner-deformation.yml'
  workflow_dispatch:

concurrency:
  group: higgs-strong-tree-corner-deformation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deform:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned research environment
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Verify corner contracts
        run: pytest -q tests/test_architecture_corners.py
      - name: Download canonical UCI HIGGS
        run: |
          set -euo pipefail
          if curl -fL --retry 3 --retry-delay 5 https://archive.ics.uci.edu/static/public/280/higgs.zip -o /tmp/higgs.zip; then
            member=$(unzip -Z1 /tmp/higgs.zip | grep -E '(^|/)HIGGS\.csv\.gz$' | head -1)
            test -n "$member"
            unzip -p /tmp/higgs.zip "$member" > /tmp/HIGGS.csv.gz
            rm -f /tmp/higgs.zip
          else
            curl -fL --retry 3 --retry-delay 5 https://archive.ics.uci.edu/ml/machine-learning-databases/00280/HIGGS.csv.gz -o /tmp/HIGGS.csv.gz
          fi
          test -s /tmp/HIGGS.csv.gz
      - name: Run strong-corner deformation
        run: |
          set -euo pipefail
          mkdir -p research-results /tmp/higgs-cache
          git rev-parse HEAD > research-results/SOURCE_COMMIT.txt
          cp experiments/higgs_shadow_protocol.json research-results/
          python -m pip freeze > research-results/environment.txt
          python -u experiments/higgs_strong_tree_corner_deformation.py \
            --csv-gz /tmp/HIGGS.csv.gz \
            --cache /tmp/higgs-cache \
            --model-out research-results/canonical-catboost-500k.json \
            --out research-results/higgs-strong-tree-corner-deformation.json \
            | tee research-results/higgs-strong-tree-corner-deformation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: higgs-strong-tree-corner-deformation
          path: research-results/
          if-no-files-found: warn
