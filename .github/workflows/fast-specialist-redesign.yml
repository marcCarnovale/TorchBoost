name: Fast specialist redesign

on:
  push:
    branches: [research/unified-progressive-2026-09-24]
    paths:
      - 'experiments/fast_specialist_redesign.py'
      - '.github/workflows/fast-specialist-redesign.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specialist:
    strategy:
      fail-fast: false
      matrix:
        regime: [oblique, interaction]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned benchmark environment
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Run specialist redesign
        run: |
          mkdir -p results
          python -u experiments/fast_specialist_redesign.py \
            --regime ${{ matrix.regime }} --seed 733 \
            --out results/${{ matrix.regime }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-specialist-${{ matrix.regime }}
          path: results/
          if-no-files-found: warn
