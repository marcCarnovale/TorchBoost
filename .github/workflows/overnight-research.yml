name: Overnight research studies
on:
  push:
    branches: [research/unified-progressive-2026-09-24]
permissions:
  contents: read
jobs:
  deep-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]'
      - run: python experiments/deep_direct_feedback_power_tree.py --seed 71 --updates 2048 --out deep-direct-71.json
      - uses: actions/upload-artifact@v4
        with:
          name: deep-direct
          path: deep-direct-71.json
