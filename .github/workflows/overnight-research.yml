name: Overnight research studies
on:
  push:
    branches: [research/unified-progressive-2026-09-24]
permissions:
  contents: read
jobs:
  direct-feedback-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]'
      - name: Evaluation seed 17
        run: python experiments/direct_feedback_control.py --seed 17 --updates 16 | tee direct-17.json
      - name: Evaluation seed 29
        run: python experiments/direct_feedback_control.py --seed 29 --updates 16 | tee direct-29.json
      - uses: actions/upload-artifact@v4
        with:
          name: direct-feedback-heldout
          path: direct-*.json
