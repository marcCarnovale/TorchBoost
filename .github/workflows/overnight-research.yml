name: Overnight research studies
on:
  push:
    branches: [research/unified-progressive-2026-09-24]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact research source
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          git archive --format=tar.gz --prefix=TorchBoost/ HEAD > torchboost-source.tar.gz
          sha256sum torchboost-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: torchboost-source-${{ github.sha }}
          path: |
            torchboost-source.tar.gz
            SOURCE_COMMIT.txt
            SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  direct-feedback-dose-matched:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]'
      - name: Evaluate development-selected and temperature-matched direct feedback
        run: python experiments/direct_feedback_temperature_match.py --updates 16 --out direct-feedback-temperature-match.json
      - uses: actions/upload-artifact@v4
        with:
          name: direct-feedback-temperature-match
          path: direct-feedback-temperature-match.json

  covtype-system-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]'
      - name: Run separated selection/ranking/audit Covertype system benchmark
        run: python experiments/covtype_system_benchmark.py --seed 53 --train 80000 --out covtype-system-80k-53.json
      - uses: actions/upload-artifact@v4
        with:
          name: covtype-system-80k
          path: covtype-system-80k-53.json

  law-high-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]'
      - name: Higher-capacity central-force diagnostic
        run: python experiments/scientific_law_discovery.py --seed 83 --nfit 32000 --depth 6 --updates 1024 --noise .05 --out law-high-83.json
      - uses: actions/upload-artifact@v4
        with:
          name: law-high-capacity
          path: law-high-83.json
