name: Overnight research studies
on:
  push:
    branches: [research/unified-progressive-2026-09-24]
    paths:
      - 'torchboost/**'
      - 'experiments/**'
      - '.github/workflows/overnight-research.yml'
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact research source
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          git archive --format=tar.gz --prefix=TorchBoost/ HEAD > torchboost-source.tar.gz
          sha256sum torchboost-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: torchboost-source-${{ github.sha }}
          path: |
            torchboost-source.tar.gz
            SOURCE_COMMIT.txt
            SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  deep-controller-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and research dependencies
        run: |
          python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' 'catboost==1.2.8'
      - name: Run development calibration and fresh-seed confirmations
        run: |
          set -euo pipefail
          mkdir -p research-results
          git rev-parse HEAD > research-results/SOURCE_COMMIT.txt
          python -m pip freeze > research-results/environment.txt
          python experiments/deep_controller_protocol.py --phase development --seed 97 --updates 2048 --out research-results/development-97.json | tee research-results/development-97.log
          python experiments/calibrate_controller_dose.py --development research-results/development-97.json --out research-results/development-calibrated-97.json | tee research-results/calibration.log
          for seed in 101 103; do
            python experiments/deep_controller_protocol.py --phase confirmation --seed "$seed" --updates 2048 --protocol research-results/development-calibrated-97.json --out "research-results/confirmation-$seed.json" | tee "research-results/confirmation-$seed.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-controller-protocol
          path: research-results/
          if-no-files-found: warn

  covtype-depth-screen:
    needs: deep-controller-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and pinned CatBoost
        run: |
          python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' 'catboost==1.2.8'
      - name: Rank deeper forests and stronger CatBoost without opening audit
        run: |
          set -euo pipefail
          mkdir -p research-results
          git rev-parse HEAD > research-results/SOURCE_COMMIT.txt
          python -m pip freeze > research-results/environment.txt
          python experiments/covtype_depth_screen.py --seed 59 --train 80000 --out research-results/covtype-depth-59.json | tee research-results/covtype-depth-59.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: covtype-depth-screen
          path: research-results/
          if-no-files-found: warn

  native-forest-replication:
    needs: covtype-depth-screen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [67, 73]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and research dependencies
        run: |
          python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' 'catboost==1.2.8'
      - name: Replicate generic post-interpolation compression
        run: |
          set -euo pipefail
          mkdir -p research-results
          git rev-parse HEAD > research-results/SOURCE_COMMIT.txt
          python -m pip freeze > research-results/environment.txt
          python experiments/native_interpolating_forest.py --seed ${{ matrix.seed }} --out research-results/native-forest.json | tee research-results/native-forest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-forest-${{ matrix.seed }}
          path: research-results/
          if-no-files-found: warn
