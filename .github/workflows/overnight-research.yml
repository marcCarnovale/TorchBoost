name: Overnight research studies
on:
  push:
    branches: [research/unified-progressive-2026-09-24]
permissions:
  contents: read
jobs:
  native-overcomplete:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]'
      - run: python experiments/native_overcomplete_progressive.py --seed 41 --out native-overcomplete.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-overcomplete
          path: native-overcomplete.json
