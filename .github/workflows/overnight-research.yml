name: Central force duration study
on: push
permissions:
  contents: read
jobs:
  law-duration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]'
      - run: python experiments/scientific_law_discovery.py --seed 83 --nfit 8000 --depth 4 --updates 128 --noise .05 --out law-83-128.json
      - run: python experiments/scientific_law_discovery.py --seed 83 --nfit 8000 --depth 4 --updates 512 --noise .05 --out law-83-512.json
      - run: python experiments/scientific_law_discovery.py --seed 83 --nfit 8000 --depth 4 --updates 2048 --noise .05 --out law-83-2048.json
      - uses: actions/upload-artifact@v4
        with:
          name: law-duration
          path: law-83-*.json
