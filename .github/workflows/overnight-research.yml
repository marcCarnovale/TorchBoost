name: Native interpolating forest replication 62
on: push
permissions:
  contents: read
jobs:
  native-interpolation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]'
      - run: python experiments/native_interpolating_forest.py --seed 62 --out native-interpolation-62.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-interpolation-62
          path: native-interpolation-62.json
