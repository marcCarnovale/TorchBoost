name: External residual adapter benchmark

on:
  push:
    branches: [research/unified-progressive-2026-09-24]
    paths:
      - 'experiments/external_adapter_benchmark.py'
      - 'experiments/higgs_differentiable_adapter.py'
      - 'experiments/summarize_external_adapter_benchmark.py'
      - 'torchboost/adaptive/residual_adapter.py'
      - 'tests/test_higgs_differentiable_adapter.py'
      - 'tests/test_external_adapter_summary.py'
      - 'research/external_adapter_benchmark_protocol.md'
      - '.github/workflows/external-adapter-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: external-adapter-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        dataset: [phoneme, bioresponse, bank-marketing, magic-telescope, default-credit, electricity, miniboone]
        seed: [509, 733, 2027, 4099, 8191]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned benchmark environment
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Verify frozen architecture contracts
        run: |
          pytest -q tests/test_architecture_corners.py tests/test_higgs_differentiable_adapter.py tests/test_external_adapter_summary.py
      - name: Run external benchmark cell
        run: |
          set -euo pipefail
          mkdir -p results
          git rev-parse HEAD > results/SOURCE_COMMIT.txt
          python -m pip freeze > results/environment.txt
          cp research/external_adapter_benchmark_protocol.md results/
          python -u experiments/external_adapter_benchmark.py \
            --dataset ${{ matrix.dataset }} \
            --seed ${{ matrix.seed }} \
            --out results/${{ matrix.dataset }}-${{ matrix.seed }}.json \
            | tee results/${{ matrix.dataset }}-${{ matrix.seed }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-adapter-${{ matrix.dataset }}-${{ matrix.seed }}
          path: results/
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aggregation dependency
        run: python -m pip install 'numpy>=1.24'
      - name: Download benchmark cells
        uses: actions/download-artifact@v5
        with:
          pattern: external-adapter-*
          path: collected
      - name: Aggregate paired results
        run: |
          set -euo pipefail
          mkdir -p summary
          python experiments/summarize_external_adapter_benchmark.py \
            --root collected \
            --json-out summary/external-adapter-summary.json \
            --md-out summary/EXTERNAL_ADAPTER_SUMMARY.md \
            | tee summary/aggregation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-adapter-summary
          path: summary/
          if-no-files-found: warn
