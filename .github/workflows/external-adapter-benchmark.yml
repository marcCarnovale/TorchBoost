name: External residual adapter benchmark

on:
  push:
    branches: [research/unified-progressive-2026-09-24]
    paths:
      - 'experiments/external_adapter_benchmark.py'
      - '.github/workflows/external-adapter-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        dataset: [phoneme, bioresponse, bank-marketing, magic-telescope, default-credit, electricity, miniboone]
        seed: [733, 2027, 4099]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned benchmark environment
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Run external benchmark
        run: |
          set -euo pipefail
          mkdir -p results
          python -u experiments/external_adapter_benchmark.py             --dataset ${{ matrix.dataset }}             --seed ${{ matrix.seed }}             --out results/${{ matrix.dataset }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-adapter-${{ matrix.dataset }}-${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
