name: HIGGS residual adapter scale-source control

on:
  push:
    branches: [research/unified-progressive-2026-09-24]
    paths:
      - 'torchboost/adaptive/architecture_corners.py'
      - 'experiments/higgs_differentiable_adapter.py'
      - 'tests/test_higgs_differentiable_adapter.py'
      - 'research/higgs_scale_source_control_protocol.md'
      - '.github/workflows/higgs-differentiable-adapter.yml'
  workflow_dispatch:

concurrency:
  group: higgs-differentiable-adapter
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  differentiable-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned research environment
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Verify adapter contracts
        run: |
          pytest -q tests/test_architecture_corners.py tests/test_higgs_endpoint_calibration.py tests/test_higgs_differentiable_adapter.py
      - name: Download canonical UCI HIGGS
        run: |
          set -euo pipefail
          if curl -fL --retry 3 --retry-delay 5 https://archive.ics.uci.edu/static/public/280/higgs.zip -o /tmp/higgs.zip; then
            member=$(unzip -Z1 /tmp/higgs.zip | grep -E '(^|/)HIGGS\.csv\.gz$' | head -1)
            test -n "$member"
            unzip -p /tmp/higgs.zip "$member" > /tmp/HIGGS.csv.gz
            rm -f /tmp/higgs.zip
          else
            curl -fL --retry 3 --retry-delay 5 https://archive.ics.uci.edu/ml/machine-learning-databases/00280/HIGGS.csv.gz -o /tmp/HIGGS.csv.gz
          fi
          test -s /tmp/HIGGS.csv.gz
      - name: Run matched scale-source control
        run: |
          set -euo pipefail
          mkdir -p research-results /tmp/higgs-cache
          git rev-parse HEAD > research-results/SOURCE_COMMIT.txt
          cp experiments/higgs_shadow_protocol.json research-results/
          cp research/higgs_scale_source_control_protocol.md research-results/
          python -m pip freeze > research-results/environment.txt
          python -u experiments/higgs_differentiable_adapter.py             --csv-gz /tmp/HIGGS.csv.gz             --cache /tmp/higgs-cache             --out research-results/higgs-differentiable-adapter.json             --checkpoint-dir research-results/checkpoints             | tee research-results/higgs-differentiable-adapter.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: higgs-differentiable-adapter
          path: research-results/
          if-no-files-found: warn
