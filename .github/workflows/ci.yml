name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff==0.16.9'
      - run: ruff check .
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch for CPU runners
        run: python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install exact reproduced research stack
        if: matrix.python-version == '3.12'
        run: python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Install compatibility stack
        if: matrix.python-version == '3.11'
        run: python -m pip install -e '.[dev,benchmark]'
      - name: Current adaptive research contracts
        run: pytest -q tests/test_unified.py tests/test_grouped_oblique.py tests/test_oof_forest.py tests/test_topology_normalized_physics.py tests/test_normalized_optimizer_physics.py tests/test_effective_tree_count.py tests/test_leaf_evidence.py tests/test_direct_feedback_contract.py tests/test_thermal_exposure.py tests/test_deep_controller_protocol.py tests/test_covtype_depth_screen.py tests/test_controller_dose_calibration.py tests/test_controller_loss_scale.py tests/test_normalized_energy_source.py tests/test_deep_local_physics.py tests/test_physics_campaign.py tests/test_higgs_hybrid_benchmark.py
      - run: python examples/minimal.py
      - run: python examples/stagewise_binary.py
      - run: python -m benchmarks.run_binary --quick --seeds 0 --output /tmp/torchboost-smoke.json
  performance-ratchet:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install research package and pinned CatBoost
        run: |
          python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
          python -m pip install 'catboost==1.2.8' -c research-constraints-2026-09-25.txt
      - name: CatBoost performance ratchet
        run: pytest -q tests/slow/test_catboost_ratchet.py
  mechanism-monitor:
    continue-on-error: true
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Experimental recurring-regime physics monitor
        run: pytest -q tests/slow/test_physics_ratchet.py
