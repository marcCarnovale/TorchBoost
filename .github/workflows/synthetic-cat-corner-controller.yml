name: Synthetic CatBoost-corner controller

on:
  push:
    branches: [research/unified-progressive-2026-09-24]
    paths:
      - 'experiments/synthetic_cat_corner_controller_v6.py'
      - '.github/workflows/synthetic-cat-corner-controller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-controller:
    strategy:
      fail-fast: false
      matrix:
        regime: [axis_sparse, oblique_dense, mixed]
        n: [2000, 8000]
        seed: [733, 2027, 4099]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned benchmark environment
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Run semantic explore-exploit controller
        run: |
          set -euo pipefail
          mkdir -p results
          python -u experiments/synthetic_cat_corner_controller_v6.py \
            --regime ${{ matrix.regime }} \
            --n ${{ matrix.n }} \
            --seed ${{ matrix.seed }} \
            --out results/${{ matrix.regime }}-n${{ matrix.n }}-s${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-cat-corner-v6-${{ matrix.regime }}-n${{ matrix.n }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
