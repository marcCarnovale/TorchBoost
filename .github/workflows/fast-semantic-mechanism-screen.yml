name: Fast semantic mechanism screen

on:
  push:
    branches: [research/unified-progressive-2026-09-24]
    paths:
      - 'experiments/fast_semantic_mechanism_screen.py'
      - '.github/workflows/fast-semantic-mechanism-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-screen:
    strategy:
      fail-fast: false
      matrix:
        regime: [axis, oblique, ridge, interaction, regional_mix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned benchmark environment
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]' -c research-constraints-2026-09-25.txt
      - name: Run fast mechanism triage
        run: |
          set -euo pipefail
          mkdir -p results
          python -u experiments/fast_semantic_mechanism_screen.py \
            --regime ${{ matrix.regime }} --seed 733 \
            --out results/${{ matrix.regime }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-semantic-${{ matrix.regime }}
          path: results/
          if-no-files-found: warn
